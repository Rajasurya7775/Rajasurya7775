<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Darkness Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409" />
      <stop offset="35%" stop-color="#050b18" />
      <stop offset="70%" stop-color="#081026" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Animated Dark Electric Cyber Text Gradient (No Rose/Pink) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe; #38bdf8; #818cf8; #a78bfa; #00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #a78bfa; #00f2fe; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #a78bfa; #00f2fe; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Dark Electric Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.35" />
    </linearGradient>

    <!-- Subtle Deep Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f1f38" stroke-width="0.75" opacity="0.45" />
      <circle cx="40" cy="40" r="1.1" fill="#00f2fe" opacity="0.2" />
    </pattern>

    <!-- Clip Path for clean rounded corners -->
    <clipPath id="cardClip">
      <rect width="1200" height="320" rx="18" />
    </clipPath>

    <!-- Deep Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(-20px); opacity: 0; }
        25% { opacity: 0.55; }
        75% { opacity: 0.55; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .font-mono {
        font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .scan {
        animation: scanline 5s ease-in-out infinite;
      }
      .pulse-node {
        animation: pulseDot 2.4s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 16, 12;
        animation: dataStream 3.5s linear infinite;
      }
      .floating {
        animation: floatSlow 3.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Everything inside cardClip to keep neat rounded card boundary -->
  <g clip-path="url(#cardClip)">
    <!-- Base Deep Background -->
    <rect width="1200" height="320" fill="url(#bgGradient)" />
    <rect width="1200" height="320" fill="url(#grid)" />

    <!-- Deep Ambient Glow Blobs (Cyan / Violet / Indigo — No Rose) -->
    <circle cx="160" cy="70" r="150" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
    <circle cx="1040" cy="250" r="160" fill="#4f46e5" opacity="0.1" filter="url(#glow)" />
    <circle cx="600" cy="140" r="180" fill="#1e1b4b" opacity="0.25" filter="url(#glow)" />

    <!-- Scanline sweep -->
    <g class="scan">
      <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#textGrad)" stroke-width="1.8" opacity="0.55" />
    </g>

    <!-- Circuit & Telemetry Lines (Left Side: IoT / Sensors — Electric Cyan) -->
    <g opacity="0.7">
      <path d="M 30 160 L 130 160 L 170 105 L 280 105" fill="none" stroke="#00f2fe" stroke-width="1.5" class="stream-line" />
      <path d="M 30 215 L 110 215 L 150 255 L 270 255" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="30" cy="160" r="4" fill="#00f2fe" />
      <circle cx="170" cy="105" r="3.5" fill="#00f2fe" class="pulse-node" />
      <circle cx="280" cy="105" r="7" fill="#00f2fe" opacity="0.3" />
      <circle cx="280" cy="105" r="4" fill="#00f2fe" />
      <circle cx="30" cy="215" r="3.5" fill="#0284c7" />
      <circle cx="150" cy="255" r="3" fill="#0284c7" />
      <circle cx="270" cy="255" r="4" fill="#0284c7" />
      <!-- Telemetry mini text -->
      <text x="45" y="90" fill="#475569" class="font-mono" font-size="10.5" letter-spacing="1">RX//TX : SERIAL_READY</text>
      <text x="45" y="285" fill="#475569" class="font-mono" font-size="10.5" letter-spacing="1">BAUD : 115200 // SENSORS OK</text>
    </g>

    <!-- Circuit & Data Flow Lines (Right Side: Cloud / Data Pipeline — Electric Violet & Sapphire) -->
    <g opacity="0.7">
      <path d="M 1170 160 L 1070 160 L 1030 105 L 920 105" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-line" />
      <path d="M 1170 215 L 1090 215 L 1050 255 L 930 255" fill="none" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="1170" cy="160" r="4" fill="#818cf8" />
      <circle cx="1030" cy="105" r="3.5" fill="#818cf8" class="pulse-node" />
      <circle cx="920" cy="105" r="7" fill="#818cf8" opacity="0.3" />
      <circle cx="920" cy="105" r="4" fill="#818cf8" />
      <circle cx="1170" cy="215" r="3.5" fill="#6366f1" />
      <circle cx="1050" cy="255" r="3" fill="#6366f1" />
      <circle cx="930" cy="255" r="4" fill="#6366f1" />
      <!-- Data pipeline mini text -->
      <text x="980" y="90" fill="#475569" class="font-mono" font-size="10.5" letter-spacing="1" text-anchor="start">PIPELINE : ACTIVE_STREAM</text>
      <text x="980" y="285" fill="#475569" class="font-mono" font-size="10.5" letter-spacing="1" text-anchor="start">DB_SYNC : 100% HEALTHY</text>
    </g>

    <!-- HUD Corner Brackets -->
    <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.75">
      <path d="M 18 36 L 18 18 L 36 18" />
      <path d="M 1182 36 L 1182 18 L 1164 18" />
      <path d="M 18 284 L 18 302 L 36 302" />
      <path d="M 1182 284 L 1182 302 L 1164 302" />
    </g>

    <!-- Center Content Stack -->
    <g transform="translate(600, 0)">

      <!-- Status Badge (Top Pill) -->
      <g transform="translate(0, 42)">
        <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#080e1e" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
        <circle cx="-110" cy="0" r="6" fill="#10b981" opacity="0.35">
          <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-110" cy="0" r="3.5" fill="#10b981"/>
        <text x="-95" y="4" fill="#94a3b8" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.5">SYSTEM ACTIVE // ONLINE</text>
        <text x="100" y="4.5" fill="#00f2fe" class="font-mono" font-size="12" font-weight="bold">&gt;_</text>
      </g>

      <!-- Main Title: RAJASURYA (Floating wrapper) -->
      <g transform="translate(0, 118)">
        <g class="floating">
          <!-- Deep Glow Underlay -->
          <text x="0" y="0" text-anchor="middle" class="font-sans" font-size="56" font-weight="900" letter-spacing="8" fill="url(#textGrad)" opacity="0.3" filter="url(#glow)">
            RAJASURYA
          </text>
          <!-- Crisp Foreground -->
          <text x="0" y="0" text-anchor="middle" class="font-sans" font-size="56" font-weight="900" letter-spacing="8" fill="url(#textGrad)">
            RAJASURYA
          </text>
        </g>
      </g>

      <!-- Slogan / Subtitle -->
      <g transform="translate(0, 160)">
        <text x="0" y="0" text-anchor="middle" class="font-mono" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="2.5">
          BUILDING END-TO-END SYSTEMS • ALWAYS LEARNING, ALWAYS IMPROVING
        </text>
      </g>

      <!-- Feature Pillars / Badges -->
      <g transform="translate(0, 218)">
        <!-- Pill 1: Python & Backend (Cyan) -->
        <g transform="translate(-300, 0)">
          <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#060c18" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8" />
          <circle cx="-65" cy="0" r="3.5" fill="#00f2fe" />
          <text x="-48" y="4" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">PYTHON • FLASK</text>
        </g>

        <!-- Pill 2: Data & ETL (Sky Blue) -->
        <g transform="translate(-100, 0)">
          <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#060c18" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
          <circle cx="-65" cy="0" r="3.5" fill="#38bdf8" />
          <text x="-48" y="4" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">ETL • SQL • DATA</text>
        </g>

        <!-- Pill 3: IoT & Hardware (Emerald Green) -->
        <g transform="translate(100, 0)">
          <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#060c18" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
          <circle cx="-65" cy="0" r="3.5" fill="#10b981" />
          <text x="-48" y="4" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">IoT • HARDWARE</text>
        </g>

        <!-- Pill 4: AI Assisted Dev (Electric Violet) -->
        <g transform="translate(300, 0)">
          <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#060c18" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
          <circle cx="-65" cy="0" r="3.5" fill="#818cf8" />
          <text x="-48" y="4" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="600">AI • AUTOMATION</text>
        </g>
      </g>

      <!-- Bottom Decorative Terminal Line -->
      <g transform="translate(0, 275)">
        <text x="0" y="0" text-anchor="middle" class="font-mono" font-size="11" fill="#475569" letter-spacing="2">
          &lt; THINK • BUILD • DEBUG • LEARN • IMPROVE /&gt;
        </text>
      </g>

    </g>
  </g>

  <!-- Outer Cyber Card Border -->
  <rect x="2" y="2" width="1196" height="316" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" opacity="0.8" />
</svg>
